name: Failure Analysis
description: Route a failure or defect to the Failure Analysis & Improvement Agent
title: "[Failure] "
labels: ["agent:failure-analysis"]
body:
  - type: input
    id: source
    attributes:
      label: Source
      description: Validation issue, production incident, or client report
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What failed
      description: Observable symptom, error, or wrong outcome
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, metrics, screenshots, reproduction steps
