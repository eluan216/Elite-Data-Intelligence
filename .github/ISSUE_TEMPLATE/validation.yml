name: Validation Request
description: Request Validation / Test Execution Agent to run checks on a deliverable
title: "[Validation] "
labels: ["agent:validation", "quality-gate"]
body:
  - type: input
    id: artifact
    attributes:
      label: Artifact or PR
      description: Path, PR number, or link to the work under test
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: What must pass for this to be approved
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Validation type
      options:
        - Data quality / pipeline
        - Model evaluation
        - Agent behavior
        - Production readiness
        - Documentation / model card
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Related engagement issue, risks, or known gaps
