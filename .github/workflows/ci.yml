name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flagship-tests:
    name: Flagship pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ops-priority-decision-system
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Train/eval smoke
        env:
          PYTHONPATH: .
        run: python -m src.train_eval

  web-app-build:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Production build
        run: npm run build
        env:
          RESEND_API_KEY: ""
          CONTACT_TO_EMAIL: ""
