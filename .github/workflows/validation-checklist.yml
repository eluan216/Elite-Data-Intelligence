name: Validation Agent Checklist

on:
  issues:
    types: [labeled]

concurrency:
  group: validation-checklist-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  post-checklist:
    if: github.event.label.name == 'agent:validation'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post Validation checklist
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- validation-agent-checklist -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) {
              console.log('Checklist already present; skipping.');
              return;
            }
            const body = [
              marker,
              '## Validation / Test Execution Agent — checklist',
              '',
              '_Auto-posted when `agent:validation` is applied. Complete before marking pass/fail._',
              '',
              '### 1. Scope',
              '- [ ] Artifact / PR / path under test is identified',
              '- [ ] Acceptance criteria are explicit and testable',
              '- [ ] Related engagement or parent issue linked (if any)',
              '',
              '### 2. Checks run',
              '- [ ] Data quality / schema / lineage (if applicable)',
              '- [ ] Model or agent evaluation against agreed metrics (if applicable)',
              '- [ ] Production readiness (monitoring, rollback, docs) (if applicable)',
              '- [ ] Documentation / model card completeness (if applicable)',
              '',
              '### 3. Evidence',
              '- [ ] Results attached or linked (logs, scores, screenshots)',
              '- [ ] Failures described with severity',
              '',
              '### 4. Outcome',
              '- [ ] **PASS** — ready for quality-gate release, or',
              '- [ ] **FAIL** — open Failure Analysis issue (`agent:failure-analysis`) with evidence',
              '',
              '### 5. Sign-off',
              '- [ ] Validation outcome recorded in a comment',
              '- [ ] Human gate applied if risk is High / regulated',
              '',
              '---',
              'Reference: `agents/validation-test-execution-agent.md` · `docs/delivery-playbook.md`',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
