name: Agent workspace QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'web-app/**'
      - '.github/workflows/agent-workspace-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Install browser QA tools
        run: npm install --no-save playwright @axe-core/playwright
      - name: Check installed Chrome
        run: google-chrome --version
      - name: Production build
        run: npm run build
      - name: Exercise agent workspace
        run: node scripts/agent-workspace-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-workspace-qa
          path: web-app/artifacts/agents
